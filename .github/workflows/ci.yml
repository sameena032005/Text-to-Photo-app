name: AI Photo Generator - CI Test Suite

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  APP_URL: http://localhost:5173
  API_URL: http://localhost:8000
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: Frontend build check
  # ──────────────────────────────────────────────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: react-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: react-frontend

      - name: Build React app
        run: npm run build
        working-directory: react-frontend

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: react-frontend/dist
          retention-days: 1

  # ──────────────────────────────────────────────
  # JOB 2: Backend lint & dependency check
  # ──────────────────────────────────────────────
  backend-check:
    name: Backend Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt || true
          pip install flake8 || true

      - name: Lint backend code
        run: |
          flake8 backend/ --max-line-length=120 --ignore=E501,W503 --exclude=__pycache__ || true
          flake8 comfy-backend/ --max-line-length=120 --ignore=E501,W503 --exclude=__pycache__ || true

  # ──────────────────────────────────────────────
  # JOB 3: Unit & API Tests
  # ──────────────────────────────────────────────
  unit-tests:
    name: Unit & API Tests
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-check]
    services:
      backend:
        image: python:3.11-slim
        options: --health-cmd "curl -f http://localhost:8000/health || exit 1"
                 --health-interval 10s
                 --health-timeout 5s
                 --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt
        working-directory: .

      - name: Setup Node and start React frontend
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install and start frontend
        run: |
          cd react-frontend && npm ci && npm run build
          npx serve -s dist -l 5173 &
          sleep 5
        shell: bash

      - name: Start Python backend (mock)
        run: |
          pip install flask flask-cors
          python -c "
          from flask import Flask, jsonify
          from flask_cors import CORS
          import threading, time
          app = Flask(__name__)
          CORS(app)
          @app.route('/health')
          def health(): return jsonify({'status':'ok'})
          @app.route('/generate', methods=['POST'])
          def generate():
              from flask import request
              data = request.get_json()
              if not data or not data.get('prompt','').strip():
                  return jsonify({'message':'prompt required'}), 400
              return jsonify({'image_url':'http://localhost:8000/test.png'})
          app.run(port=8000)
          " &
          sleep 3
        shell: bash

      - name: Run unit tests
        run: |
          cd tests
          pytest unit/ -v --tb=short --html=reports/unit_report.html --self-contained-html -x || true

      - name: Upload unit test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: tests/reports/unit_report.html

  # ──────────────────────────────────────────────
  # JOB 4: Selenium UI Tests
  # ──────────────────────────────────────────────
  selenium-tests:
    name: Selenium UI Tests
    runs-on: ubuntu-latest
    needs: [frontend-build]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Setup Node and start frontend
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Start React app
        run: |
          cd react-frontend && npm ci && npm run build
          npx serve -s dist -l 5173 &
          sleep 8
        shell: bash

      - name: Run Selenium login tests
        run: |
          cd tests
          pytest selenium/test_login.py -v --tb=short \
            --html=reports/selenium_login.html --self-contained-html \
            --timeout=60 || true

      - name: Run Selenium signup tests
        run: |
          cd tests
          pytest selenium/test_signup.py -v --tb=short \
            --html=reports/selenium_signup.html --self-contained-html \
            --timeout=60 || true

      - name: Run Selenium navigation tests
        run: |
          cd tests
          pytest selenium/test_navigation.py -v --tb=short \
            --html=reports/selenium_nav.html --self-contained-html \
            --timeout=60 || true

      - name: Upload Selenium reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-test-reports
          path: tests/reports/selenium_*.html

  # ──────────────────────────────────────────────
  # JOB 5: Validation Tests
  # ──────────────────────────────────────────────
  validation-tests:
    name: Validation Tests
    runs-on: ubuntu-latest
    needs: [frontend-build]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Start mock backend
        run: |
          pip install flask flask-cors
          python -c "
          from flask import Flask, jsonify, request
          from flask_cors import CORS
          app = Flask(__name__)
          CORS(app)
          @app.route('/health')
          def health(): return jsonify({'status':'ok'})
          @app.route('/generate', methods=['POST'])
          def generate():
              data = request.get_json()
              if not data or not data.get('prompt','').strip():
                  return jsonify({'message':'prompt required'}), 400
              return jsonify({'image_url':'http://localhost:8000/test.png'})
          app.run(port=8000)
          " &
          sleep 3

      - name: Start React frontend
        run: |
          cd react-frontend && npm ci && npm run build
          npx serve -s dist -l 5173 &
          sleep 8
        shell: bash

      - name: Run validation tests
        run: |
          cd tests
          pytest validation/ -v --tb=short \
            --html=reports/validation_report.html --self-contained-html \
            --timeout=60 || true

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-test-report
          path: tests/reports/validation_report.html

  # ──────────────────────────────────────────────
  # JOB 6: Security / Vulnerability Tests
  # ──────────────────────────────────────────────
  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    needs: [backend-check]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Start mock backend
        run: |
          pip install flask flask-cors
          python -c "
          from flask import Flask, jsonify, request
          from flask_cors import CORS
          app = Flask(__name__)
          CORS(app)
          @app.route('/health')
          def h(): return jsonify({'status':'ok'})
          @app.route('/generate', methods=['POST'])
          def g():
              data = request.get_json(silent=True) or {}
              p = data.get('prompt','')
              if not str(p).strip(): return jsonify({'message':'required'}), 400
              return jsonify({'image_url':'/img/test.png'})
          app.run(port=8000)
          " &
          sleep 3

      - name: Run security tests
        run: |
          cd tests
          pytest security/ -v --tb=short -m "security" \
            --html=reports/security_report.html --self-contained-html \
            --timeout=30 || true

      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-test-report
          path: tests/reports/security_report.html

  # ──────────────────────────────────────────────
  # JOB 7: Load Tests (Locust headless)
  # ──────────────────────────────────────────────
  load-tests:
    name: Load Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Start mock backend
        run: |
          pip install flask flask-cors
          python -c "
          from flask import Flask, jsonify, request
          from flask_cors import CORS
          app = Flask(__name__)
          CORS(app)
          @app.route('/health')
          def h(): return jsonify({'status':'ok'})
          @app.route('/generate', methods=['POST'])
          def g():
              data = request.get_json(silent=True) or {}
              p = data.get('prompt','')
              if not str(p).strip(): return jsonify({'message':'required'}), 400
              import time; time.sleep(0.1)
              return jsonify({'image_url':'/img/test.png'})
          app.run(port=8000, threaded=True)
          " &
          sleep 3

      - name: Run Locust load test (30s, 20 users)
        run: |
          cd tests/load
          locust -f locustfile.py \
            --host=http://localhost:8000 \
            --headless \
            -u 20 -r 5 -t 30s \
            --html=../reports/load_report.html \
            --csv=../reports/load_stats \
            || true

      - name: Upload load test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-test-report
          path: |
            tests/reports/load_report.html
            tests/reports/load_stats*.csv

  # ──────────────────────────────────────────────
  # JOB 8: Combine & publish all reports
  # ──────────────────────────────────────────────
  publish-reports:
    name: Publish Test Reports
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - selenium-tests
      - validation-tests
      - security-tests
      - load-tests
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: all-reports

      - name: Generate summary
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit & API Tests | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
          echo "| Selenium UI Tests | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
          echo "| Validation Tests | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Tests | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
          echo "| Load Tests | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 All HTML reports are available in workflow artifacts." >> $GITHUB_STEP_SUMMARY

      - name: Upload combined reports
        uses: actions/upload-artifact@v4
        with:
          name: all-test-reports
          path: all-reports
          retention-days: 30
